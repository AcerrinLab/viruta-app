# Levanta la base de datos y el backend. Uso: docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: viruta
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  backend:
    build: ./Viruta-backend
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/viruta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  datos-mysql:
