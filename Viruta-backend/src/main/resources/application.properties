# Viruta-backend. Ninguna clave va en este archivo: todo llega por variables de entorno (ver .env.example).
spring.application.name=viruta-backend
server.port=${PORT:8080}

# Base de datos (MySQL en Docker, RNF-13)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/viruta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:viruta}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad (RNF-08)
viruta.jwt.secreto=${JWT_SECRETO:}
viruta.jwt.horas=24
viruta.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
viruta.admin.email=${ADMIN_EMAIL:}
viruta.admin.password=${ADMIN_PASSWORD:}
# Administradores maestros: "Nombre|email|clave;Nombre|email|clave" (sin clave = solo entran con Google)
viruta.admins=${VIRUTA_ADMINS:}
# Ingreso con Google: client id de Google Identity Services (vacio = boton apagado)
viruta.google.client-id=${GOOGLE_CLIENT_ID:}

# Direcciones publicas
viruta.frontend.url=${FRONTEND_URL:http://localhost:5173}
viruta.backend.url=${BACKEND_URL:http://localhost:8080}

# Negocio: comision del 8 al 12 por ciento a cargo de la carpinteria, sena sobre el total del presupuesto
viruta.comision.porcentaje=${COMISION_PORCENTAJE:10}
viruta.sena.porcentaje=${SENA_PORCENTAJE:50}

# Pagos: "simulado" para desarrollo y demo, "mercadopago" para cobrar de verdad
viruta.pagos.modo=${PAGOS_MODO:simulado}
viruta.mercadopago.token=${MP_ACCESS_TOKEN:}
viruta.mercadopago.secreto-webhook=${MP_WEBHOOK_SECRETO:}

# Wishlist (Google Sheets): URL /exec del Apps Script con doGet que devuelve {clientes, talleres}
viruta.wishlist.sheets-url=${WISHLIST_SHEETS_URL:}

# WhatsApp (verificacion de telefono y avisos): apagado hasta tener la API de Meta conectada a n8n
viruta.whatsapp.habilitado=${WHATSAPP_HABILITADO:false}

# Aviso por WhatsApp via n8n (si esta vacio, el aviso solo queda en el panel)
viruta.n8n.webhook=${N8N_WEBHOOK_URL:}
